# Publishes gallery/ to GitHub Pages as-is: no build step, no Jekyll.
name: Hang the gallery

on:
  push:
    branches: [main]
    paths: ["gallery/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gallery
      - id: deployment
        uses: actions/deploy-pages@v5
